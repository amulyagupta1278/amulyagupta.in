name: SEO validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: seo/requirements.txt
      - run: pip install -r seo/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: |
          python -m http.server 8000 >/tmp/amulyagupta-site.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python seo/audit_all.py --target https://amulyagupta.in --fetch-origin http://127.0.0.1:8000 --fail-on critical
